  - Annexes:
    - Plan détaillé: zz_annexes/plan_detaille.md
    - CMD vs PowerShell: zz_annexes/cmd_vs_powershell.md
    - Remote PowerShell: zz_annexes/remote_powershell.md
    - Credentials: zz_annexes/credentials.md
