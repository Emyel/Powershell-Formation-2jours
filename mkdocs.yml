site_name: Formation Powershell 2 jours
site_author: Mathieu Lanoë
repo_url: https://github.com/Emyel/Powershell-Formation-2jours

theme:
  name: material
  language: fr
  palette:
    primary: indigo

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - tables

nav:
