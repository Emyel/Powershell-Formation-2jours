    - La Triforce: j1_02_triforce/index.md
    - Pipeline & Objets: j1_03_pipeline_objets/index.md
    - Variables: j1_04_variables/index.md
    - Collections: j1_05_collections/index.md
    - 💪 Exercice 1: j1_ex1_variables/index.md
    - Opérateurs: j1_06_operateurs/index.md
    - Manipulation d'objets: j1_07_manipulation_objets/index.md
    - 💪 Exercice 2: j1_ex2_objets/index.md
    - Import / Export: j1_08_import_export/index.md
    - 💪 Exercice 3: j1_ex3_import_export/index.md
  - Jour 2:
    - Scripts & Fonctions: j2_01_scripts_fonctions/index.md
    - Structures: j2_02_structures/index.md
    - Construire son code: j2_03_construire_code/index.md
    - Paramètres avancés: j2_04_parametres/index.md
    - 💪 Exercice 4: j2_ex4_structures/index.md
